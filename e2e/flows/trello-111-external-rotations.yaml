# Trello #111 · Rotaciones externas: selector de especialidades y «Compartir experiencia»
# (el formulario cambió con #110: reseña rápida por pasos)
# https://trello.com/c/cIPcU5lb
#
# Solo lectura: no publica nada. Una experiencia es visible para otros residentes en
# producción, así que el flujo rellena el formulario y sale sin guardar.
appId: com.losresis.app
name: "#111 Rotaciones externas"
---
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml

- extendedWaitUntil:
    visible: "Nóminas"
    timeout: 20000
# Rotaciones externas vive en «Ver más opciones» de los accesos rápidos.
- tapOn: "Ver más opciones"
- scrollUntilVisible:
    element: "Rotaciones externas"
    centerElement: true
- tapOn: "Rotaciones externas"

# Hub: tres acciones diferenciadas
- extendedWaitUntil:
    visible: "ESTOY BUSCANDO DÓNDE ROTAR.*"
    timeout: 20000
# Cada tarjeta del hub es un botón: su texto accesible junta todos sus textos.
# Con un plan propio (lo deja el flujo de #110) la tarjeta pasa a «Tu plan publicado».
- assertVisible: "(YA SÉ DÓNDE VOY A ROTAR, Publicar mi plan|TU PLAN PUBLICADO).*"
- assertVisible: "YA HE REALIZADO UNA ROTACIÓN, Compartir mi experiencia.*"
- takeScreenshot: trello-111-hub

# Bug 1: el selector de especialidad tiene opciones, se busca, se aplica y se quita
- tapOn: "ESTOY BUSCANDO DÓNDE ROTAR.*"
- extendedWaitUntil:
    visible: "Especialidad"
    timeout: 10000
- tapOn: "Especialidad"
- extendedWaitUntil:
    visible: "Confirmar selección"
    timeout: 5000
- assertVisible: "CARDIOLOGIA"
- takeScreenshot: trello-111-specialty-options
- tapOn: "Buscar..."
- inputText: "pediatr"
- tapOn: "PEDIATRIA Y SUS AREAS ESPECIFICAS"
- tapOn: "Confirmar selección"
- assertVisible: "PEDIATRIA Y SUS AREAS ESPECIFICAS"
- assertVisible: "Limpiar filtros"
- takeScreenshot: trello-111-specialty-filtered
- tapOn: "Limpiar filtros"
- assertVisible: "Especialidad"
- assertNotVisible: "Limpiar filtros"

# Compartir experiencia (desde #110 es la reseña rápida por pasos; su flujo es
# trello-110-quick-review.yaml): aviso al salir con cambios
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "YA HE REALIZADO UNA ROTACIÓN.*"
    timeout: 10000
# La invitación de #110 (si hay un plan terminado) empuja la tarjeta hacia abajo.
- scrollUntilVisible:
    element: "YA HE REALIZADO UNA ROTACIÓN.*"
    centerElement: true
- tapOn: "YA HE REALIZADO UNA ROTACIÓN.*"
- extendedWaitUntil:
    visible: "¿Dónde hiciste la rotación?"
    timeout: 10000
- takeScreenshot: trello-111-publish-where
- tapOn: "Ej. Hospital Clínic o Boston Children's Hospital"
- inputText: "Boston Children's Hospital"
# El teclado se cierra tocando un texto fijo, como haría el usuario.
- tapOn: "¿Dónde hiciste la rotación?"

# Avanzar sin completar: el aviso nombra los campos que faltan
- scrollUntilVisible:
    element:
      id: "quick-review-next"
    centerElement: true
- tapOn:
    id: "quick-review-next"
- extendedWaitUntil:
    visible: "Faltan campos obligatorios"
    timeout: 5000
- assertVisible: "Completa: País, ciudad y fecha de inicio."
- takeScreenshot: trello-111-publish-missing
- tapOn: "OK"

# Salir con lo escrito: pide confirmación y no pierde nada si sigue editando
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Tienes cambios sin guardar"
    timeout: 5000
- takeScreenshot: trello-111-unsaved-alert
- tapOn: "Seguir editando"
- assertVisible: "Boston Children's Hospital"
- tapOn: "Volver"
- tapOn: "Salir sin guardar"
- extendedWaitUntil:
    visible: "YA HE REALIZADO UNA ROTACIÓN.*"
    timeout: 5000
