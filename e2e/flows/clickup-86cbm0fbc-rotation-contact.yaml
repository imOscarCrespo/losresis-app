# ClickUp 86cbm0fbc · Rotaciones externas: contacto para solicitar la rotación
# https://app.clickup.com/t/86cbm0fbc
#
# Publicación nueva desde la invitación del plan terminado → el paso 4 empieza por el
# contacto y no deja publicar sin un medio válido → el contacto queda guardado → la ficha
# de una experiencia publicada muestra su contacto → borrar. Reutiliza la preparación de #110, que limpia las reseñas de pruebas y deja el plan.
appId: com.losresis.app
name: "86cbm0fbc Contacto de rotaciones externas"
---
- runScript: ../scripts/seed-110-ended-plan.js
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml

- extendedWaitUntil:
    visible: "Nóminas"
    timeout: 20000
- tapOn: "Ver más opciones"
- scrollUntilVisible:
    element: "Rotaciones externas"
    centerElement: true
- tapOn: "Rotaciones externas"

- extendedWaitUntil:
    visible:
      id: "review-invite"
    timeout: 20000
- tapOn:
    id: "review-invite-share"

# Pasos 1 a 3 sin cambios: el plan rellena el 1, el 2 pide sus tres respuestas.
- extendedWaitUntil:
    visible: "Paso 1 de 4"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "quick-review-next"
    centerElement: true
- tapOn:
    id: "quick-review-next"
- extendedWaitUntil:
    visible: "Paso 2 de 4"
    timeout: 5000
- tapOn: "Sí"
- tapOn: "Difícil"
- tapOn: "Observacional"
- scrollUntilVisible:
    element:
      id: "quick-review-next"
    centerElement: true
- tapOn:
    id: "quick-review-next"
- extendedWaitUntil:
    visible: "Paso 3 de 4"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "quick-review-next"
    centerElement: true
- tapOn:
    id: "quick-review-next"

# Paso 4: el contacto va primero, antes del consejo
- extendedWaitUntil:
    visible: "Paso 4 de 4"
    timeout: 5000
- assertVisible: "¿Con quién pueden contactar para hacer esta rotación?"
- assertVisible: "Ayuda a otros residentes a saber a quién dirigirse para solicitar esta rotación externa."
- assertVisible: "Un consejo para el siguiente residente"
- takeScreenshot: clickup-86cbm0fbc-step-contact

# Sin medio de contacto no se publica; el nombre solo no basta.
# El teclado se cierra tocando la etiqueta del campo siguiente, que queda por encima.
- tapOn:
    id: "quick-review-contact-name"
- inputText: "Secretaria de Docencia E2E"
- tapOn: "Correo electrónico"
- scrollUntilVisible:
    element:
      id: "quick-review-submit"
    centerElement: true
- tapOn:
    id: "quick-review-submit"
- extendedWaitUntil:
    visible: "Falta el contacto"
    timeout: 5000
- takeScreenshot: clickup-86cbm0fbc-missing-contact
- tapOn: "OK"

# Un teléfono inválido se rechaza aunque haya que dar solo un medio
- scrollUntilVisible:
    element:
      id: "quick-review-contact-phone"
    direction: UP
    centerElement: true
- tapOn:
    id: "quick-review-contact-phone"
- inputText: "999"
- tapOn: "Enlace para solicitar la rotación"
- scrollUntilVisible:
    element:
      id: "quick-review-submit"
    centerElement: true
- tapOn:
    id: "quick-review-submit"
- extendedWaitUntil:
    visible: "El teléfono no es válido."
    timeout: 5000
- tapOn: "OK"

# Corregido y con correo y enlace, se publica.
# Cada campo se centra antes de tocarlo: si el teclado lo tapa, el toque cae en una tecla.
- scrollUntilVisible:
    element:
      id: "quick-review-contact-email"
    direction: UP
    centerElement: true
- tapOn:
    id: "quick-review-contact-email"
- inputText: "docencia-e2e@losresis.test"
# Se completa sin borrar (el cursor de Maestro no siempre queda al final): 9 dígitos iguales.
- scrollUntilVisible:
    element:
      id: "quick-review-contact-phone"
    centerElement: true
- tapOn:
    id: "quick-review-contact-phone"
- inputText: "999999"
- scrollUntilVisible:
    element:
      id: "quick-review-contact-url"
    centerElement: true
- tapOn:
    id: "quick-review-contact-url"
- inputText: "losresis.com/rotaciones-e2e"
- tapOn: "Indica al menos un correo.*"
- takeScreenshot: clickup-86cbm0fbc-contact-filled
- scrollUntilVisible:
    element:
      id: "quick-review-submit"
    centerElement: true
- tapOn:
    id: "quick-review-submit"
- extendedWaitUntil:
    visible: "¡Gracias!"
    timeout: 15000
- tapOn:
    id: "publish-success-done"

# El contacto queda guardado con la experiencia (la ficha propia no se abre desde Explorar).
- extendedWaitUntil:
    visible: "TU EXPERIENCIA PUBLICADA"
    timeout: 15000
- runScript: ../scripts/assert-86cbm0fbc-contact-saved.js

# Otro residente lo ve en la experiencia publicada. Solo lectura sobre experiencias ajenas:
# las que existen son anteriores a la tarea y siguen funcionando con su contacto antiguo.
- scrollUntilVisible:
    element: "ESTOY BUSCANDO DÓNDE ROTAR.*"
    direction: UP
    centerElement: true
- tapOn: "ESTOY BUSCANDO DÓNDE ROTAR.*"
- extendedWaitUntil:
    visible: "Hospital, servicio o ciudad"
    timeout: 10000
# La tarjeta es un botón: su texto accesible junta todos sus textos.
- scrollUntilVisible:
    element: ".*Ver experiencia.*"
    centerElement: true
- tapOn: ".*Ver experiencia.*"
- scrollUntilVisible:
    element:
      id: "review-detail-contact"
    centerElement: true
- assertVisible: "Contacto para solicitar esta rotación"
- takeScreenshot: clickup-86cbm0fbc-detail-contact
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Hospital, servicio o ciudad"
    timeout: 10000
- tapOn: "Volver"

# Limpieza: borrar la experiencia de pruebas
- extendedWaitUntil:
    visible: "TU EXPERIENCIA PUBLICADA"
    timeout: 15000
- scrollUntilVisible:
    element: "Eliminar"
    centerElement: true
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "Eliminar experiencia"
    timeout: 5000
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "YA HE REALIZADO UNA ROTACIÓN.*"
    timeout: 15000
