# ClickUp 124b4z9w0z0 · Tarjetas de repaso de ResiNotes (pasada B).
# https://app.clickup.com/t/90151808476/124b4z9w0z0
#
# Recorre los criterios de aceptación de la pasada B que siguen vigentes. La generación de
# tarjetas (de una carpeta, de un fragmento, tarjetas parecidas) se retiró en 124b4z9w5nh: el
# script siembra las tarjetas que antes generaba el flujo.
#   - Configuración de repaso: tarjetas por día (la portada lo refleja), carpetas incluidas,
#     pausar y reanudar, repaso diario desactivado, recordatorios con hora y días, y
#     «Restablecer programación» con confirmación.
#   - El script final comprueba en la BD la configuración, las tarjetas por nota y que
#     restablecer deja todas como nuevas sin borrar tarjetas ni repasos.
# El push no se puede probar en el simulador (lo prueba el ensayo de la migración con la hora
# simulada; queda pendiente probarlo en un móvil físico).
#
# Repetible: el script borra las tarjetas y la configuración del residente de pruebas y vuelve
# a crear sus apuntes. Solo toca datos del residente de pruebas.
appId: com.losresis.app
name: "124b4z9w0z0 Tarjetas de repaso (pasada B)"
---
- runScript:
    file: ../scripts/seed-124b4z9w0z0-flashcards-b.js
    env:
      MODE: reset
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../subflows/login.yaml

# ── Portada: las 8 tarjetas sembradas, 5 para hoy (límite por defecto) ──
- waitForAnimationToEnd
- tapOn: "ResiNotes"

# ── Configuración de repaso: tarjetas por día ──
- extendedWaitUntil:
    visible: "Tienes 5 tarjetas para repasar"
    timeout: 10000
- tapOn:
    id: "resinotes-review-settings"
- extendedWaitUntil:
    visible: "Configuración de repaso"
    timeout: 10000
- assertVisible: "Repaso diario"
- assertVisible: "Recordatorios"
- assertVisible: "Pausar repasos"
- assertVisible: "Restablecer programación"
- tapOn:
    id: "review-settings-daily"
- tapOn:
    id: "review-settings-limit-3"
- assertVisible: "Tarjetas por día: 3"
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Tienes 3 tarjetas para repasar"
    timeout: 10000

# ── Carpetas incluidas: solo Urgencias (sin notas) → solo la tarjeta a mano ──
- tapOn:
    id: "resinotes-review-settings"
- tapOn:
    id: "review-settings-folders"
- tapOn: "Urgencias"
- tapOn:
    id: "review-settings-folders-save"
- assertVisible: "Incluir carpetas: Urgencias"
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Tienes 1 tarjeta para repasar"
    timeout: 10000
- tapOn:
    id: "resinotes-review-settings"
- tapOn:
    id: "review-settings-folders"
- tapOn:
    id: "review-settings-folders-all"
- tapOn:
    id: "review-settings-folders-save"
- assertVisible: "Incluir carpetas: Todas"

# ── Pausar y reanudar ──
- tapOn:
    id: "review-settings-pause"
- tapOn:
    id: "review-settings-pause-7"
- assertVisible: "En pausa hasta el .*"
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Repasos en pausa"
    timeout: 10000
- takeScreenshot: 124b4z9w0z0-b5-en-pausa
- tapOn:
    id: "resinotes-review-resume"
- extendedWaitUntil:
    visible: "Tienes 3 tarjetas para repasar"
    timeout: 10000

# ── Repaso diario desactivado: no sale «Tu repaso de hoy» ──
- tapOn:
    id: "resinotes-review-settings"
- tapOn:
    id: "review-settings-enabled"
- assertVisible: "No verás «Tu repaso de hoy» ni recibirás recordatorios."
- tapOn: "Volver"
- assertNotVisible:
    id: "resinotes-review-card"
- tapOn:
    id: "resinotes-quick-cards"
- tapOn:
    id: "flashcards-settings"
- tapOn:
    id: "review-settings-enabled"

# ── Recordatorios: hora y días ──
- tapOn:
    id: "review-settings-reminders"
- extendedWaitUntil:
    visible: "Hora del recordatorio.*"
    timeout: 10000
- assertVisible: "Hora del recordatorio: 20:30"
- tapOn:
    id: "review-settings-time"
- scrollUntilVisible:
    element:
      id: "review-settings-time-2100"
    centerElement: true
- tapOn:
    id: "review-settings-time-2100"
- assertVisible: "Hora del recordatorio: 21:00"
- tapOn:
    id: "review-settings-day-7"
- assertVisible: "L M X J V S a las 21:00."
- takeScreenshot: 124b4z9w0z0-b6-configuracion
- tapOn: "Volver"
- tapOn: "Volver"

# ── Un repaso y «Ahora no» (sin push, solo sale) ──
- extendedWaitUntil:
    visible: "Tienes 3 tarjetas para repasar"
    timeout: 10000
- tapOn:
    id: "resinotes-review-start"
- extendedWaitUntil:
    visible: "Tarjeta 1 de 3"
    timeout: 10000
- tapOn:
    id: "review-show-answer"
- tapOn:
    id: "review-rate-good"
- extendedWaitUntil:
    visible: "Tarjeta 2 de 3"
    timeout: 10000
- tapOn:
    id: "review-later"
- extendedWaitUntil:
    visible: "Tienes 2 tarjetas para repasar"
    timeout: 10000

# ── Restablecer programación, con confirmación ──
- tapOn:
    id: "resinotes-review-settings"
- scrollUntilVisible:
    element:
      id: "review-settings-reset"
    centerElement: true
- tapOn:
    id: "review-settings-reset"
- extendedWaitUntil:
    visible: "¿Restablecer la programación?"
    timeout: 5000
- tapOn: "Restablecer"
- extendedWaitUntil:
    visible: "Programación restablecida"
    timeout: 10000
- assertVisible: "1 tarjeta vuelve a empezar como nueva."
- tapOn: "OK"
- tapOn: "Volver"

# ── Comprobación en la BD ──
- runScript:
    file: ../scripts/seed-124b4z9w0z0-flashcards-b.js
    env:
      MODE: assert
