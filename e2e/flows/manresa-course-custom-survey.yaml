# Manresa 2026-11-13 · Encuesta con preguntas propias del curso (valoración, sí/no, texto).
# Preparación (BD): el curso «E2E · Curso con encuesta» con survey_questions propias
# (utilidad: rating, repetirias: yes_no, mejoras: text opcional) y sin respuesta del
# residente de pruebas (repetible: si ya respondió, va directo al certificado).
#   scripts/e2e.sh e2e/flows/manresa-course-custom-survey.yaml
appId: com.losresis.app
name: "Manresa · encuesta propia del curso"
---
- runFlow:
    when:
      visible: "Open in .*LosResis.*"
    commands:
      - tapOn: "Cancel"
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml
- openLink: "losresis://course-checkin?c=e2e0b92a-0000-4000-8000-000000000004&k=000000"
- runFlow:
    when:
      visible: "Open in .*LosResis.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "E2E · Curso con encuesta"
    timeout: 30000
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element:
      text: "Encuesta y certificado"
    centerElement: true
- runFlow:
    when:
      visible:
        id: "course-survey-open"
    file: ../subflows/manresa-custom-survey-answer.yaml
- scrollUntilVisible:
    element:
      id: "course-certificate-download"
    centerElement: true
- assertVisible: "Certificado de asistencia emitido"
- takeScreenshot: manresa-survey-3-certificado
- tapOn:
    id: "course-certificate-download"
- extendedWaitUntil:
    visible: "(Save to Files|Guardar en Archivos|Print|Imprimir|Copy|Copiar)"
    timeout: 30000
- takeScreenshot: manresa-survey-4-pdf
