<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="flex items-center p-4 pt-6 border-b border-primary/10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h1 class="text-xl font-bold ml-2">Nueva categoría</h1>
</header>
<main class="flex-1 p-4 space-y-8">
<!-- Header Section -->
<section>
<h2 class="text-2xl font-bold leading-tight">Añade un nuevo bloque a tu libro de residente.</h2>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Organiza tus actividades por categorías personalizadas.</p>
</section>
<!-- Name Field -->
<section class="space-y-3">
<label class="block text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="category-name">Nombre de la categoría</label>
<input class="w-full h-14 px-4 rounded-xl border border-primary/20 bg-white dark:bg-primary/5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400" id="category-name" placeholder="Ej. Rotación Externa" type="text"/>
</section>
<!-- Suggestions/Chips -->
<section class="space-y-3">
<p class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Sugerencias rápidas</p>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary/20 bg-primary/5 hover:bg-primary/10 text-sm font-medium transition-colors">Consultas</button>
<button class="px-4 py-2 rounded-full border border-primary/20 bg-primary/5 hover:bg-primary/10 text-sm font-medium transition-colors">Hospitalización</button>
<button class="px-4 py-2 rounded-full border border-primary/20 bg-primary/5 hover:bg-primary/10 text-sm font-medium transition-colors">Investigación</button>
<button class="px-4 py-2 rounded-full border border-primary/20 bg-primary/5 hover:bg-primary/10 text-sm font-medium transition-colors">Técnicas</button>
<button class="px-4 py-2 rounded-full border border-primary/20 bg-primary/5 hover:bg-primary/10 text-sm font-medium transition-colors">Guardias</button>
</div>
</section>
<!-- Icon Selector -->
<section class="space-y-3">
<p class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Selecciona un Icono</p>
<div class="grid grid-cols-4 gap-3">
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary/10 text-primary">
<span class="material-symbols-outlined text-2xl">folder</span>
<span class="text-[10px] mt-1 font-bold">Carpeta</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border border-primary/20 bg-white dark:bg-primary/5 hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-300">stethoscope</span>
<span class="text-[10px] mt-1 font-medium text-slate-500 dark:text-slate-400">Esteto</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border border-primary/20 bg-white dark:bg-primary/5 hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-300">favorite</span>
<span class="text-[10px] mt-1 font-medium text-slate-500 dark:text-slate-400">Salud</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border border-primary/20 bg-white dark:bg-primary/5 hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-2xl text-slate-600 dark:text-slate-300">monitoring</span>
<span class="text-[10px] mt-1 font-medium text-slate-500 dark:text-slate-400">Pulso</span>
</button>
</div>
</section>
<!-- Color Tag Selector -->
<section class="space-y-3">
<p class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Etiqueta de color</p>
<div class="flex justify-between items-center bg-white dark:bg-primary/5 p-4 rounded-xl border border-primary/20">
<div class="flex gap-3">
<div class="w-8 h-8 rounded-full bg-primary ring-2 ring-primary/20 ring-offset-2 dark:ring-offset-background-dark cursor-pointer"></div>
<div class="w-8 h-8 rounded-full bg-indigo-500 cursor-pointer"></div>
<div class="w-8 h-8 rounded-full bg-pink-500 cursor-pointer"></div>
<div class="w-8 h-8 rounded-full bg-blue-500 cursor-pointer"></div>
<div class="w-8 h-8 rounded-full bg-slate-400 cursor-pointer"></div>
</div>
<span class="material-symbols-outlined text-slate-400">palette</span>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-primary/10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-[0.98] shadow-primary/30">
                Crear categoría
            </button>
</footer>
</div>
</body></html>
