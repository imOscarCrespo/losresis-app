<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#640af5",
                        "background-light": "#f7f5f8",
                        "background-dark": "#171022",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-symbol {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">arrow_back</span>
<h1 class="text-xl font-bold tracking-tight">Registrar actividad</h1>
</div>
<button class="text-primary font-bold text-sm hover:opacity-80 transition-opacity">Historial</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-lg mx-auto w-full">
<!-- Category & Activity Selectors -->
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Categoría</label>
<div class="relative">
<select class="w-full appearance-none bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pr-10 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
<option>Seleccionar categoría</option>
<option>Sala de partos</option>
<option>Quirófano</option>
<option>Urgencias obstétricas</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Actividad</label>
<div class="relative">
<select class="w-full appearance-none bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 pr-10 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
<option>Seleccionar actividad</option>
<option>Parto eutócico</option>
<option>Cesárea</option>
<option>Episiotomía</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
</div>
<!-- Registration Type (Segmented Control) -->
<div class="space-y-3">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Tipo de registro</label>
<div class="flex p-1 bg-slate-200/50 dark:bg-slate-800 rounded-xl">
<button class="flex-1 py-2 text-sm font-bold bg-white dark:bg-slate-700 shadow-sm rounded-lg text-primary transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">plus_one</span> +1 Contador
                </button>
<button class="flex-1 py-2 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">edit_note</span> Nota
                </button>
<button class="flex-1 py-2 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">checklist</span> Checklist
                </button>
</div>
</div>
<!-- Quick Action Button -->
<div class="pt-2">
<button class="w-full bg-primary/10 hover:bg-primary/15 text-primary border-2 border-dashed border-primary/30 rounded-2xl py-8 flex flex-col items-center justify-center gap-2 transition-all active:scale-95">
<span class="material-symbols-outlined text-4xl">add_circle</span>
<span class="text-lg font-bold">Añadir +1</span>
</button>
</div>
<!-- Optional Fields -->
<div class="space-y-4 pt-2">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Fecha</label>
<div class="relative">
<input class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" type="date" value="2023-10-27"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Notas breves</label>
<textarea class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none resize-none" placeholder="Comentarios o detalles del caso" rows="3"></textarea>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Guardar actividad
            </button>
</div>
<!-- Quick Suggestions -->
<div class="space-y-3 pt-4 pb-10">
<p class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Sugerencias frecuentes</p>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer hover:bg-primary/10 hover:text-primary transition-colors">Parto eutócico</span>
<span class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer hover:bg-primary/10 hover:text-primary transition-colors">Cesárea</span>
<span class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer hover:bg-primary/10 hover:text-primary transition-colors">Guardia</span>
<span class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300 cursor-pointer hover:bg-primary/10 hover:text-primary transition-colors">Sesión clínica</span>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 pb-6 pt-2 px-4">
<div class="flex justify-around items-center max-w-lg mx-auto">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined active-symbol">book</span>
<span class="text-[10px] font-bold">Libro</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-medium">Estadísticas</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</a>
</div>
</nav>
</body></html>
