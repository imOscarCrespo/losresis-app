<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Nueva Actividad</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="flex items-center px-4 py-4 border-b border-primary/20 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button class="mr-4 text-slate-700 dark:text-slate-300 hover:bg-primary/10 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined block">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Nueva actividad</h1>
</header>
<main class="flex-1 overflow-y-auto px-4 py-6 max-w-lg mx-auto w-full">
<div class="mb-8">
<p class="text-slate-600 dark:text-slate-400 text-base">Añade algo que quieras registrar dentro de esta categoría.</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                    Nombre
                </label>
<input class="w-full h-14 px-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" placeholder="Ej. Paracentesis" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                    Objetivo
                </label>
<input class="w-full h-14 px-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" placeholder="Ej. 20" type="number"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                    Tipo de Registro
                </label>
<div class="grid grid-cols-1 gap-3">
<label class="relative flex items-center p-4 rounded-xl border-2 border-primary bg-primary/5 dark:bg-primary/10 cursor-pointer transition-colors group">
<input checked="" class="w-5 h-5 text-primary focus:ring-primary border-slate-300 dark:border-slate-700" name="activity_type" type="radio"/>
<div class="ml-4 flex items-center gap-3">
<span class="material-symbols-outlined text-primary">add_circle</span>
<span class="font-medium">Contador</span>
</div>
</label>
<label class="relative flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:border-primary/50 transition-colors group">
<input class="w-5 h-5 text-primary focus:ring-primary border-slate-300 dark:border-slate-700" name="activity_type" type="radio"/>
<div class="ml-4 flex items-center gap-3">
<span class="material-symbols-outlined text-primary">description</span>
<span class="font-medium">Nota</span>
</div>
</label>
<label class="relative flex items-center p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer hover:border-primary/50 transition-colors group">
<input class="w-5 h-5 text-primary focus:ring-primary border-slate-300 dark:border-slate-700" name="activity_type" type="radio"/>
<div class="ml-4 flex items-center gap-3">
<span class="material-symbols-outlined text-primary">checklist</span>
<span class="font-medium">Checklist</span>
</div>
</label>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all active:scale-[0.98]" type="submit">
                    Añadir
                </button>
</div>
</form>
</main>
<nav class="sticky bottom-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-4 py-2 flex justify-around items-center">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-tight">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-medium uppercase tracking-tight">Progreso</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">list_alt</span>
<span class="text-[10px] font-medium uppercase tracking-tight">Actividades</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium uppercase tracking-tight">Perfil</span>
</a>
</nav>
</body></html>
