<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex flex-col min-h-screen w-full max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Libro de residente</h2>
</div>
<!-- Progress Stepper -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-2 w-8 rounded-full bg-primary/30"></div>
<div class="h-2 w-8 rounded-full bg-primary"></div>
<div class="h-2 w-8 rounded-full bg-primary/30"></div>
</div>
<!-- Header Section -->
<div class="px-4 pt-5 pb-3">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold leading-tight">Añade lo que quieres registrar</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal mt-2">Puedes añadir procedimientos, actividades o hitos importantes.</p>
</div>
<!-- Form Builder Card -->
<div class="px-4 py-4">
<div class="bg-white dark:bg-slate-800/50 rounded-xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
<div class="space-y-4">
<!-- Name Input -->
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Nombre</p>
<input class="form-input flex w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base" placeholder="Ej. Parto eutócico" type="text"/>
</label>
<!-- Objective Input -->
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Objetivo (opcional)</p>
<input class="form-input flex w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base" placeholder="Ej. Alcanzar 50 registros" type="text"/>
</label>
<!-- Type Selector -->
<div class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Tipo de registro</p>
<div class="grid grid-cols-3 gap-2">
<button class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border-2 border-primary bg-primary/10 text-primary">
<span class="material-symbols-outlined">exposure_plus_1</span>
<span class="text-xs font-bold">Contador</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border border-slate-300 dark:border-slate-600 hover:border-primary transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">description</span>
<span class="text-xs font-medium">Nota</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 p-3 rounded-xl border border-slate-300 dark:border-slate-600 hover:border-primary transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">fact_check</span>
<span class="text-xs font-medium">Checklist</span>
</button>
</div>
</div>
</div>
<!-- Add Activity Button -->
<button class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-primary/10 text-primary border border-primary/20 py-3 font-bold hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">add_circle</span>
                    Añadir actividad
                </button>
</div>
</div>
<!-- Examples / List Preview -->
<div class="px-4 py-2 mb-24">
<h3 class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest mb-3">Tus registros</h3>
<div class="space-y-2">
<div class="flex items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl">medical_services</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Cesárea</p>
<p class="text-xs text-slate-500">Contador • Sin objetivo</p>
</div>
</div>
<span class="material-symbols-outlined text-slate-300">drag_handle</span>
</div>
<div class="flex items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl">school</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Sesión clínica</p>
<p class="text-xs text-slate-500">Nota • Objetivo: 10</p>
</div>
</div>
<span class="material-symbols-outlined text-slate-300">drag_handle</span>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800">
<button class="flex w-full items-center justify-center rounded-xl bg-primary py-4 px-6 text-white font-bold text-lg shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all">
                Continuar
            </button>
</div>
</div>
</body></html>
