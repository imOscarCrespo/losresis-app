<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sesión de Estudio - Los Resis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8b5cf6",
                        "background-light": "#f8f6f6",
                        "background-dark": "#1e0f24",
                        "secondary": "#bd8dce",
                        "accent": "#5b2e6b",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%238b5cf6' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-white/10 px-4 py-4">
<div class="flex items-center justify-between max-w-md mx-auto">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Sesión de Estudio</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-1 max-w-md mx-auto w-full px-4 py-6 space-y-6">
<!-- Hero Illustration/Card -->
<div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-primary to-accent p-6 text-white shadow-lg shadow-primary/20">
<div class="relative z-10">
<h2 class="text-xl font-bold mb-1">Nueva Sesión</h2>
<p class="text-white/80 text-sm">Registra tus horas de estudio para el MIR o rotación actual.</p>
</div>
<div class="absolute -right-4 -bottom-4 opacity-20">
<span class="material-symbols-outlined text-[120px]">menu_book</span>
</div>
</div>
<!-- Form Section -->
<div class="space-y-5 bg-white dark:bg-white/5 p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-sm">
<!-- Topic Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 px-1">Tema de estudio</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 group-focus-within:text-primary transition-colors">medical_services</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-white/10 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" placeholder="Ej. Cardiología, Pediatría..." type="text"/>
</div>
</div>
<!-- Duration Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 px-1">Duración estimada</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 group-focus-within:text-primary transition-colors">timer</span>
<select class="w-full pl-12 pr-10 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-white/10 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none">
<option disabled="" selected="" value="">Seleccionar duración</option>
<option value="30m">30 minutos</option>
<option value="1h">1 hora</option>
<option value="2h">2 horas</option>
<option value="4h">4 horas</option>
<option value="plus">+4 horas</option>
</select>
</div>
</div>
<!-- Notes Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-300 px-1">Notas y observaciones</label>
<div class="relative group">
<textarea class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-white/10 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none resize-none" placeholder="Anota conceptos clave o dudas pendientes..." rows="4"></textarea>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/30 transition-transform active:scale-[0.98]">
            Guardar Sesión
        </button>
<div class="h-20"></div> <!-- Padding for nav bar -->
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 z-20 bg-white/90 dark:bg-background-dark/95 backdrop-blur-xl border-t border-slate-200 dark:border-white/10 pb-6 pt-2">
<div class="max-w-md mx-auto flex justify-around items-center px-4">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-secondary" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-icon">book_2</span>
<span class="text-[10px] font-medium">Estudios</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-secondary" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-[10px] font-medium">Calendario</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-secondary" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</a>
</div>
</nav>
</body></html>
