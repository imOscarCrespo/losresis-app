<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nueva Guardia - Los Resis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#6366f1", 
                "background-light": "#f8fafc",
                "background-dark": "#0f172a",
              },
              fontFamily: {
                "display": ["Public Sans", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<!-- Header Section -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 pt-6 pb-4 border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center justify-between">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">arrow_back_ios_new</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-50">Nueva Guardia</h1>
<div class="w-10"></div> <!-- Spacer for centering title -->
</div>
</header>
<main class="max-w-md mx-auto p-4 space-y-6 pb-32">
<!-- Hero Illustration/Icon -->
<div class="flex flex-col items-center py-4">
<div class="w-20 h-20 bg-indigo-100 dark:bg-indigo-900/30 rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-indigo-600 dark:text-indigo-400 text-4xl">medical_services</span>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">Registra tu jornada de hoy</p>
</div>
<!-- Form Section -->
<div class="space-y-4">
<!-- Date Field -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Fecha de la Guardia</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400">calendar_today</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Hospital Selector -->
<!-- Department/Service -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Servicio / Departamento</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400">stethoscope</span>
<select class="w-full pl-11 pr-10 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary appearance-none text-slate-900 dark:text-slate-100">
<option>Guardia Adultos</option>
<option>Pediatría</option>
<option>Terapia Intensiva</option>
<option>Traumatología</option>
<option>Ginecología</option>
</select>
<span class="material-symbols-outlined absolute right-3 pointer-events-none text-slate-400">expand_more</span>
</div>
</div>
<!-- Shift Type -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<label class="block mb-3 text-sm font-semibold text-slate-700 dark:text-slate-300">Tipo de Guardia</label>
<div class="grid grid-cols-3 gap-2">
<button class="py-3 px-1 rounded-xl border-2 border-primary bg-primary/10 text-primary text-sm font-bold flex flex-col items-center">
<span class="material-symbols-outlined mb-1">schedule</span>
                        24h
                    </button>
<button class="py-3 px-1 rounded-xl border-2 border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-sm font-semibold flex flex-col items-center hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined mb-1">hourglass_bottom</span>
                        12h
                    </button>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-none transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Confirmar Registro
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 pb-safe-area-inset-bottom">
<div class="max-w-md mx-auto flex justify-around items-center px-4 py-3">
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 text-indigo-600 dark:text-indigo-400" href="#">
<span class="material-symbols-outlined active-icon">clinical_notes</span>
<span class="text-[10px] font-medium">Guardias</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-[10px] font-medium">Calendario</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</a>
</div>
</nav>

</div>
</body></html>
