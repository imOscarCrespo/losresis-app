<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Añadir Congreso - Los Resis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#670CF5",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-xl">
<!-- Header -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-4 justify-between border-b border-slate-200 dark:border-slate-800">
<div class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Añadir Congreso</h2>
</div>
<!-- Form Content -->
<div class="flex flex-col gap-6 p-4 pb-24">
<!-- Section: Info General -->
<div class="bg-white dark:bg-slate-900/50 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col gap-4">
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-2 px-1">Nombre del Congreso</p>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 placeholder:text-slate-400 p-4 text-base font-normal leading-normal" placeholder="Ej. Congreso Nacional de Residentes" value=""/>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-2 px-1">Ubicación</p>
<div class="flex w-full items-stretch rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus-within:ring-2 focus-within:ring-primary/50">
<input class="form-input flex-1 border-none bg-transparent text-slate-900 dark:text-slate-100 focus:ring-0 p-4 text-base font-normal leading-normal" placeholder="Ciudad, País" value=""/>
<div class="text-slate-400 flex items-center justify-center px-4">
<span class="material-symbols-outlined">map</span>
</div>
</div>
</label>
</div>
<!-- Section: Fechas (Calendar) -->
<div class="bg-white dark:bg-slate-900/50 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-4 px-1">Seleccionar Fechas</p>
<div class="flex flex-col gap-0.5">
<div class="flex items-center p-1 justify-between mb-2">
<button class="text-primary p-2 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight flex-1 text-center">Junio 2024</p>
<button class="text-primary p-2 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center">
<p class="text-slate-400 text-xs font-bold py-2">L</p>
<p class="text-slate-400 text-xs font-bold py-2">M</p>
<p class="text-slate-400 text-xs font-bold py-2">M</p>
<p class="text-slate-400 text-xs font-bold py-2">J</p>
<p class="text-slate-400 text-xs font-bold py-2">V</p>
<p class="text-slate-400 text-xs font-bold py-2">S</p>
<p class="text-slate-400 text-xs font-bold py-2">D</p>
<!-- Calendar Days Example -->
<button class="h-10 w-full text-slate-300 text-sm font-medium col-start-6">1</button>
<button class="h-10 w-full text-slate-300 text-sm font-medium">2</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">3</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">4</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">5</button>
<button class="h-10 w-full text-white bg-primary rounded-l-full text-sm font-medium">6</button>
<button class="h-10 w-full bg-primary/20 text-slate-900 dark:text-slate-100 text-sm font-medium">7</button>
<button class="h-10 w-full text-white bg-primary rounded-r-full text-sm font-medium">8</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">9</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">10</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">11</button>
<button class="h-10 w-full text-slate-900 dark:text-slate-100 text-sm font-medium">12</button>
</div>
</div>
</div>
<!-- Section: Rol del Residente -->
<div class="bg-white dark:bg-slate-900/50 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal pb-4 px-1">Tu Rol en el Congreso</p>
<div class="flex flex-col gap-3">
<label class="flex items-center justify-between p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">visibility</span>
<span class="text-slate-900 dark:text-slate-100 font-medium">Asistente</span>
</div>
<div class="w-5 h-5 rounded-full border-4 border-primary bg-white"></div>
<input checked="" class="hidden" name="role" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-colors">
<div class="flex items-center gap-3 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">record_voice_over</span>
<span class="font-medium">Ponente</span>
</div>
<div class="w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600"></div>
<input class="hidden" name="role" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 cursor-pointer hover:border-primary/50 transition-colors">
<div class="flex items-center gap-3 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">description</span>
<span class="font-medium">Póster / Comunicación</span>
</div>
<div class="w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600"></div>
<input class="hidden" name="role" type="radio"/>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-95 mb-8">
                Registrar Congreso
            </button>
</div>
<!-- Bottom NavBar -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-20 flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg px-4 pb-6 pt-2">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-xs font-medium leading-normal">Inicio</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">apartment</span>
<p class="text-xs font-medium leading-normal">Congresos</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-xs font-medium leading-normal">Perfil</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">settings</span>
<p class="text-xs font-medium leading-normal">Ajustes</p>
</a>
</div>
</div>
</body></html>
