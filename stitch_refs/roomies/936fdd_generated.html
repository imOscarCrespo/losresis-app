<!-- BEGIN: Interaction Script -->
<script data-purpose="selection-logic">
    function selectOption(element) {
      // Remove selection from all cards
      const cards = document.querySelectorAll('[data-purpose="option-card"]');
      cards.forEach(card => {
        card.classList.remove('card-selected', 'border-brandPurple');
        card.classList.add('border-gray-100');
      });
      
      // Add selection to clicked card
      element.classList.add('card-selected', 'border-brandPurple');
      element.classList.remove('border-gray-100');
    }
  </script>
<!-- END: Interaction Script -->
